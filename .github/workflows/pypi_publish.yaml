name: Manual PyPI Publish

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    # Check out the repository files onto the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Set up an isolated Python runtime environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Install core building and deployment tools
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    # Compile the package wheel and source archives
    - name: Build Package Distributions
      run: python -m build

    # Ssecurely upload to PyPI using twine and the stored repository secret token
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload dist/*